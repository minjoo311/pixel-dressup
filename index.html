<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b1d2e">
  <title>PIXEL CLOSET</title>
  <link rel="icon" href="assets/ui/sparkle.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 시작 화면 -->
  <div id="start" class="start">
    <div class="start-inner">
      <h1 class="logo" id="logo">PIXEL CLOSET</h1>
      <canvas id="startPreview" class="pixel"></canvas>
      <button id="startBtn" class="press-start">PRESS START</button>
      <p class="start-hint">♪ 음악과 효과음이 나와요</p>
    </div>
  </div>

  <div class="app" id="app">
    <!-- 무대 (녹화되는 구역) -->
    <section class="stage-wrap" id="stageWrap">
      <canvas id="stage" class="pixel" aria-label="코디 미리보기"></canvas>
      <div class="rec-badge" id="recBadge" hidden><i></i>REC <span id="recTime">00:00</span></div>
      <div class="countdown" id="countdown" hidden>3</div>
      <div class="photo-hint" id="photoHint">화면을 탭하면 돌아가요</div>
    </section>

    <!-- 옷장 / 레이어 / 붓 팔레트 -->
    <section class="panel" id="panel">
      <div class="seg" id="seg">
        <button class="seg-btn on" data-view="closet">옷장</button>
        <button class="seg-btn" data-view="layers">레이어 <span id="layerCount">0</span></button>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="content" id="content"></div>
    </section>

    <!-- 하단 버튼 -->
    <nav class="bottom">
      <button class="btn" id="randomBtn"><img class="icon" src="assets/ui/icon_dice.png" alt="">랜덤</button>
      <button class="btn done" id="doneBtn"><img class="icon" src="assets/ui/icon_star.png" alt="">완성!</button>
      <button class="btn rec" id="recBtn"><img class="icon" id="recIcon" src="assets/ui/icon_rec.png" alt=""><span id="recLabel">녹화</span></button>
      <button class="btn" id="menuBtn"><img class="icon" src="assets/ui/icon_menu.png" alt="">메뉴</button>
    </nav>
  </div>

  <!-- 메뉴 -->
  <div class="sheet-back" id="menuSheet" hidden>
    <div class="sheet" role="dialog" aria-label="메뉴">
      <div class="sheet-head"><strong>메뉴</strong></div>
      <div class="menu-grid">
        <button class="btn" id="mSave"><img class="icon" src="assets/ui/icon_heart.png" alt="">코디 저장함</button>
        <button class="btn" id="mPhoto"><img class="icon" src="assets/ui/icon_camera.png" alt="">사진 모드</button>
        <button class="btn" id="mPng"><img class="icon" src="assets/ui/icon_download.png" alt="">PNG 저장</button>
        <button class="btn" id="mAdmin"><img class="icon" src="assets/ui/icon_plus.png" alt="">아이템 추가</button>
        <button class="btn toggle" id="bgmToggle">배경음악 ON</button>
        <button class="btn toggle" id="sfxToggle">효과음 ON</button>
      </div>
      <div class="sheet-actions">
        <button class="btn small primary" data-close>닫기</button>
      </div>
    </div>
  </div>

  <!-- 색 바꾸기 시트 (레이어에서) -->
  <div class="sheet-back" id="colorSheet" hidden>
    <div class="sheet" role="dialog" aria-label="색 바꾸기">
      <div class="sheet-head">
        <canvas id="colorThumb" class="pixel"></canvas>
        <strong id="colorName"></strong>
      </div>
      <div id="colorBody">
        <div class="swatches" id="colorPresets"></div>
        <label class="slider">색조<input type="range" id="hueIn" min="-180" max="180" step="1"></label>
        <label class="slider">채도<input type="range" id="satIn" min="-100" max="100" step="1"></label>
        <label class="slider">밝기<input type="range" id="lightIn" min="-60" max="60" step="1"></label>
      </div>
      <p class="muted" id="colorOff" hidden>무늬가 있는 아이템이라 색 바꾸기가 꺼져 있어요.</p>
      <div class="sheet-actions">
        <button class="btn small" id="colorReset">원래대로</button>
        <button class="btn small primary" id="colorDone">완료</button>
      </div>
    </div>
  </div>

  <!-- 저장 슬롯 -->
  <div class="sheet-back" id="saveSheet" hidden>
    <div class="sheet" role="dialog" aria-label="코디 저장">
      <div class="sheet-head"><strong>코디 저장함</strong></div>
      <div class="slots" id="slots"></div>
      <div class="sheet-actions">
        <button class="btn small primary" data-close>닫기</button>
      </div>
    </div>
  </div>

  <!-- 녹화 결과 -->
  <div class="sheet-back" id="videoSheet" hidden>
    <div class="sheet" role="dialog" aria-label="녹화 영상">
      <div class="sheet-head"><strong>녹화 완료!</strong></div>
      <video id="videoPreview" class="video-preview" controls playsinline loop></video>
      <p class="muted" id="videoInfo"></p>
      <div class="sheet-actions">
        <button class="btn small" data-close>닫기</button>
        <button class="btn small" id="videoShare">공유 · 사진앱에 저장</button>
        <button class="btn small primary" id="videoSave">영상 저장</button>
      </div>
    </div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
